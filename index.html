<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoolSkin13 — Indie Game Developer</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #181a1f;
      color: #e6e8ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #22252c;
      border: 1px solid #303540;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 6px; font-size: 24px; color: #ffffff; }
    .subtitle { color: #9aa3b2; font-size: 14px; margin-bottom: 24px; }
    .game-box {
      background: #181a1f;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .game-box h2 { margin: 0 0 8px; font-size: 18px; color: #f5b963; }
    .game-box p { margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: #c4cad4; }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn:hover { background: #2563eb; }
    .footer { font-size: 13px; color: #8c95a4; border-top: 1px solid #303540; padding-top: 16px; }
    .footer a { color: #7aa7f7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CoolSkin13</h1>
    <div class="subtitle">Independent Mobile Game Development</div>

    <div class="game-box">
      <h2>Tap Block Puzzle: Art Game</h2>
      <p>Relaxing isometric puzzle game with cozy hand-crafted illustrations, calm atmosphere, and collection rewards.</p>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.coolskin13.tapblockpuzzle" target="_blank" rel="noopener">
        Get it on Google Play
      </a>
    </div>

    <div class="footer">
      Support &amp; Inquiries: <a href="mailto:CoolSkin13.Support@gmail.com">CoolSkin13.Support@gmail.com</a>
    </div>
  </div>
</body>
</html>
